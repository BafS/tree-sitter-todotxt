[package]
name = "tree-sitter-todotxt"
description = "todo.txt grammar for tree-sitter"
version = "0.1.0"
authors = ["BafS"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "todotxt"]
categories = ["parser-implementations", "parsing", "text-editors"]
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26"
